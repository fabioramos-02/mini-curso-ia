site_name: Relatórios com IA — mini curso SGD
site_description: Como pedir à IA um relatório em HTML pronto, no padrão do Design System MS. Mini curso interno da SGD/SETDIG.
site_author: SETDIG — Secretaria-Executiva de Transformação Digital
site_url: https://fabioramos-02.github.io/mini-curso-ia/

docs_dir: docs

theme:
  name: material
  language: pt-BR

  logo: assets/img/segov-logo.svg
  favicon: assets/img/brasao-ms.svg
  font: false

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo escuro

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/segov.css

extra:
  generator: false

  social:
    - icon: material/web
      link: https://www.setdig.ms.gov.br/
      name: SETDIG

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji

nav:
  - Início: index.md
  - 1. Por que: 01-por-que.md
  - 2. As 4 premissas: 02-premissas.md
  - 3. Perguntas: 03-perguntas.md
  - 4. Prompt base: 04-prompt-base.md
  - 5. Dados: 05-dados.md
  - 6. Estrutura no Design System: 06-estrutura-ds.md
  - 7. Exemplo real: 07-exemplo.md
  - 8. Checklist: 08-checklist.md
  - 9. Próximos passos: 09-proximos-passos.md
  - Slides: slides/index.html
